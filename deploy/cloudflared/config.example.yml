# ~/.cloudflared/config.yml
#
# Подставить свой id туннеля и домен. Файл с учёткой (<id>.json) кладётся
# рядом и наружу не отдаётся никогда.

tunnel: ЗАМЕНИТЬ-НА-ID-ТУННЕЛЯ
credentials-file: /root/.cloudflared/ЗАМЕНИТЬ-НА-ID-ТУННЕЛЯ.json

# Идём на localhost: наружу торчит cloudflared, а не сам сервер.
ingress:
  - hostname: valanium.example.com
    service: http://127.0.0.1:8787
    originRequest:
      # WebSocket живёт долго, и рвать его по таймауту происхождения нельзя.
      noTLSVerify: false
      connectTimeout: 10s
      # Держим дольше, чем период heartbeat клиента (30 с).
      tcpKeepAlive: 30s

  # Всё остальное — в отказ, иначе туннель станет открытым прокси.
  - service: http_status:404
