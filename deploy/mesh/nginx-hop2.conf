map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Вход определяется портом, на котором принят запрос, и ничем больше:
# 8082 — Tor, остальное — Cloudflare. Подробнее в obsidian-proxy.conf.
map $server_port $obsidian_route {
    8082    onion;
    default cloudflare;
}

# На onion-входе адреса клиента не существует: заголовок обнуляется, и
# приложение считает такие соединения одним общим ведром с отдельными лимитами.
# На остальных входах приходит то, что поставил Cloudflare, либо — на втором
# этапе Multi-hop — то, что передал первый узел, куда чужому не достучаться.
map $server_port $obsidian_client_ip {
    8082    "";
    default $http_cf_connecting_ip;
}

server {
    listen 127.0.0.1:8080;
    listen 127.0.0.1:8082;
    server_name _;
    client_max_body_size 17m;

    location = /multihop/ws {
        proxy_pass http://10.77.0.2:8081/ws;
        include /etc/nginx/snippets/obsidian-proxy.conf;
    }
    location ^~ /multihop/v1/ {
        proxy_pass http://10.77.0.2:8081/v1/;
        include /etc/nginx/snippets/obsidian-proxy.conf;
    }
    location / {
        proxy_pass http://10.77.0.1:8080;
        include /etc/nginx/snippets/obsidian-proxy.conf;
    }
}

server {
    listen 10.77.0.3:8081;
    server_name _;
    client_max_body_size 17m;
    allow 10.77.0.2;
    deny all;

    location / {
        proxy_pass http://10.77.0.1:8080;
        include /etc/nginx/snippets/obsidian-proxy.conf;
    }
}
