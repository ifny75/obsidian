map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Что попадает в журнал доступа.
#
# Формат по умолчанию пишет User-Agent, а он у мессенджера — не «браузер»,
# а точная модель телефона и сборка ОС: строки вида
# "Dalvik/2.1.0 (Linux; U; Android 17; Pixel 8 Pro Build/CP2A.260805.005)"
# вместе со временем каждого запуска приложения лежали здесь две недели.
# Ни адреса, ни User-Agent, ни referer тут больше нет: для дела хватает
# времени, кода ответа и пути, а всё остальное — досье на человека, которое
# мы завели бы себе сами.

# Вход определяется портом, на котором принят запрос, и ничем больше:
# 8082 — Tor, остальное — Cloudflare. Подробнее в valanium-proxy.conf.
# Ослепление адреса: наружу из этого узла едет жетон, а не IP.
# Подробности и цена решения — в valanium-blind.js.
js_import valanium from /etc/nginx/valanium-blind.js;
js_set $valanium_blinded valanium.blindClient;

# Откуда берётся жетон, зависит от входа:
#   8080 — пришло от Cloudflare, ослепляем здесь;
#   8081 — второй этап Multi-hop, адреса тут уже нет: передаём как есть;
#   8082 — Tor, адреса не существует вовсе.
map $server_port $valanium_client {
    8081    $http_x_valanium_client;
    8082    "onion";
    default $valanium_blinded;
}

map $server_port $valanium_route {
    8082    onion;
    default cloudflare;
}


server {
    listen 127.0.0.1:8080;
    listen 127.0.0.1:8082;
    server_name _;
    access_log /var/log/nginx/access.log valanium;
    client_max_body_size 17m;

    # Выбор второго плеча человеком. Имена те же, что на странице состояния:
    # человек видит там Alpha/Beta/Gamma и выбирает из них же.
    location = /multihop/alpha/ws {
        access_log off;
        return 421;
    }
    location ^~ /multihop/alpha/v1/ {
        return 421;
    }
    location = /multihop/beta/ws {
        access_log off;
        proxy_pass http://10.77.0.4:8081/ws;
        include /etc/nginx/snippets/valanium-proxy.conf;
    }
    location ^~ /multihop/beta/v1/ {
        proxy_pass http://10.77.0.4:8081/v1/;
        include /etc/nginx/snippets/valanium-proxy.conf;
    }
    location = /multihop/gamma/ws {
        access_log off;
        proxy_pass http://10.77.0.5:8081/ws;
        include /etc/nginx/snippets/valanium-proxy.conf;
    }
    location ^~ /multihop/gamma/v1/ {
        proxy_pass http://10.77.0.5:8081/v1/;
        include /etc/nginx/snippets/valanium-proxy.conf;
    }

    location = /multihop/ws {
        # Длительность и объём сессии — тоже сведения о человеке.
        access_log off;
        proxy_pass http://10.77.0.4:8081/ws;
        include /etc/nginx/snippets/valanium-proxy.conf;
    }
    location ^~ /multihop/v1/ {
        proxy_pass http://10.77.0.4:8081/v1/;
        include /etc/nginx/snippets/valanium-proxy.conf;
    }
    location = /ws {
        # Прямой маршрут до main: сессию сокета не журналируем по той же
        # причине, что и второй этап Multi-hop.
        access_log off;
        proxy_pass http://10.77.0.1:8080;
        include /etc/nginx/snippets/valanium-proxy.conf;
    }
    location / {
        proxy_pass http://10.77.0.1:8080;
        include /etc/nginx/snippets/valanium-proxy.conf;
    }
}

server {
    listen 10.77.0.3:8081;
    server_name _;
    # Второй этап Multi-hop — это чужая сессия целиком: путь, длительность,
    # объём. Журналировать её здесь незачем ровно по тем же причинам, что и
    # на входе.
    access_log off;
    client_max_body_size 17m;
    allow 10.77.0.4;
    allow 10.77.0.5;
    deny all;

    location / {
        proxy_pass http://10.77.0.1:8080;
        include /etc/nginx/snippets/valanium-proxy.conf;
    }
}
