map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Не журналируем адрес, User-Agent или referer.
log_format obsidian '$time_iso8601 $status $request_method $uri $body_bytes_sent';

js_import obsidian from /etc/nginx/obsidian-blind.js;
js_set $obsidian_blinded obsidian.blindClient;

map $server_port $obsidian_client {
    8081    $http_x_obsidian_client;
    8082    "onion";
    default $obsidian_blinded;
}

map $server_port $obsidian_route {
    8082    onion;
    default cloudflare;
}

# Cloudflare и Tor входят только через loopback.
server {
    listen 127.0.0.1:8080;
    listen 127.0.0.1:8082;
    server_name _;
    access_log /var/log/nginx/access.log obsidian;
    client_max_body_size 17m;

    # Пока hop3 не поднят, вторым плечом Multi-hop служит hop1.
    location = /multihop/ws {
        access_log off;
        proxy_pass http://10.77.0.2:8081/ws;
        include /etc/nginx/snippets/obsidian-proxy.conf;
    }
    location ^~ /multihop/v1/ {
        proxy_pass http://10.77.0.2:8081/v1/;
        include /etc/nginx/snippets/obsidian-proxy.conf;
    }
    location = /ws {
        access_log off;
        proxy_pass http://10.77.0.1:8080;
        include /etc/nginx/snippets/obsidian-proxy.conf;
    }
    location / {
        proxy_pass http://10.77.0.1:8080;
        include /etc/nginx/snippets/obsidian-proxy.conf;
    }
}

# Зарезервировано для использования hop4 как второго плеча после включения
# остальных relay. Публичного доступа к этому listener нет.
server {
    listen 10.77.0.5:8081;
    server_name _;
    access_log off;
    client_max_body_size 17m;
    allow 10.77.0.2;
    deny all;

    location / {
        proxy_pass http://10.77.0.1:8080;
        include /etc/nginx/snippets/obsidian-proxy.conf;
    }
}
