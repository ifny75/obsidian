map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Main никогда не слушает публичный интерфейс. Доступ сюда разрешён только
# двум relay-узлам по WireGuard (10.77.0.2 и 10.77.0.3).
server {
    listen 10.77.0.1:8080;
    server_name _;

    client_max_body_size 17m;

    location = /ws {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        # Метку входа ставит relay и только он: сюда не дотянуться
        # ниоткуда, кроме двух узлов по WireGuard.
        proxy_set_header X-Obsidian-Route $http_x_obsidian_route;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        # Метку входа ставит relay и только он: сюда не дотянуться
        # ниоткуда, кроме двух узлов по WireGuard.
        proxy_set_header X-Obsidian-Route $http_x_obsidian_route;
    }

    location ^~ /downloads/ {
        alias /opt/obsidian-releases/;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
