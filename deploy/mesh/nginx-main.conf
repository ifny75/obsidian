map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Что попадает в журнал доступа.
#
# Формат по умолчанию пишет User-Agent, а он у мессенджера — не «браузер»,
# а точная модель телефона и сборка ОС: строки вида
# "Dalvik/2.1.0 (Linux; U; Android 17; Pixel 8 Pro Build/CP2A.260805.005)"
# вместе со временем каждого запуска приложения лежали здесь две недели.
# Ни адреса, ни User-Agent, ни referer тут больше нет: для дела хватает
# времени, кода ответа и пути, а всё остальное — досье на человека, которое
# мы завели бы себе сами.
log_format obsidian '$time_iso8601 $status $request_method $uri $body_bytes_sent';

# Main никогда не слушает публичный интерфейс. Доступ сюда разрешён только
# двум relay-узлам по WireGuard (10.77.0.2 и 10.77.0.3).
server {
    listen 10.77.0.1:8080;
    server_name _;
    access_log /var/log/nginx/access.log obsidian;

    client_max_body_size 17m;

    location = /ws {
        # Длительность и объём сессии — тоже сведения о человеке.
        access_log off;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        # Метку входа ставит relay и только он: сюда не дотянуться
        # ниоткуда, кроме двух узлов по WireGuard.
        proxy_set_header X-Obsidian-Route $http_x_obsidian_route;
        # Жетон вместо адреса: настоящего IP тут нет и быть не должно.
        proxy_set_header X-Obsidian-Client $http_x_obsidian_client;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        # Метку входа ставит relay и только он: сюда не дотянуться
        # ниоткуда, кроме двух узлов по WireGuard.
        proxy_set_header X-Obsidian-Route $http_x_obsidian_route;
    }

    location ^~ /downloads/ {
        alias /opt/obsidian-releases/;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
