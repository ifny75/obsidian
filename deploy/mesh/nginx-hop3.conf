map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Не журналируем адрес, User-Agent или referer.

js_import valanium from /etc/nginx/valanium-blind.js;
js_set $valanium_blinded valanium.blindClient;

map $server_port $valanium_client {
    8081    $http_x_valanium_client;
    8082    "onion";
    default $valanium_blinded;
}

map $server_port $valanium_route {
    8082    onion;
    default cloudflare;
}

# Cloudflare и Tor входят только через loopback.
server {
    listen 127.0.0.1:8080;
    listen 127.0.0.1:8082;
    server_name _;
    access_log /var/log/nginx/access.log valanium;
    client_max_body_size 17m;

    # Второе плечо Multi-hop у этого узла — hop4.
    location = /multihop/ws {
        access_log off;
        proxy_pass http://10.77.0.5:8081/ws;
        include /etc/nginx/snippets/valanium-proxy.conf;
    }
    location ^~ /multihop/v1/ {
        proxy_pass http://10.77.0.5:8081/v1/;
        include /etc/nginx/snippets/valanium-proxy.conf;
    }
    location = /ws {
        access_log off;
        proxy_pass http://10.77.0.1:8080;
        include /etc/nginx/snippets/valanium-proxy.conf;
    }
    location / {
        proxy_pass http://10.77.0.1:8080;
        include /etc/nginx/snippets/valanium-proxy.conf;
    }
}

# Зарезервировано для использования hop4 как второго плеча после включения
# остальных relay. Публичного доступа к этому listener нет.
server {
    listen 10.77.0.4:8081;
    server_name _;
    access_log off;
    client_max_body_size 17m;
    # Только hop4: с ним есть и пиринг WireGuard, и правило firewall.
    # Обещать доступ узлам, до которых нет маршрута, — вводить в заблуждение
    # того, кто будет это читать при следующей правке сети.
    allow 10.77.0.5;
    deny all;

    location / {
        proxy_pass http://10.77.0.1:8080;
        include /etc/nginx/snippets/valanium-proxy.conf;
    }
}
