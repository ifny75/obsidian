proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;

# Откуда пришёл запрос, решает порт, на котором его приняли, а не сам запрос.
#
# Это не педантизм. `CF-Connecting-IP` ставит Cloudflare, перезаписывая то, что
# прислал клиент, — и приложение этому заголовку верит, потому что до него
# запрос доходит с петли. Но onion-вход стоит мимо Cloudflare: там перезаписать
# заголовок некому, и клиент через Tor назначал бы себе любой адрес. А это не
# только обход собственных лимитов, но и возможность приписать свой трафик
# чужому IP и выесть лимиты живому человеку.
#
# Поэтому оба заголовка выставляются здесь принудительно, по $server_port:
# 8082 — это Tor, всё остальное — Cloudflare. Прислать их самому клиент не
# может: что бы он ни отправил, значение подставится заново.
proxy_set_header CF-Connecting-IP $obsidian_client_ip;
proxy_set_header X-Obsidian-Route $obsidian_route;

proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_buffering off;
