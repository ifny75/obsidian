proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;

# Кто клиент и откуда он пришёл, решает узел, а не сам запрос.
#
# Настоящий адрес дальше этого узла не едет вовсе: вместо него жетон, из
# которого IP не восстановить (см. obsidian-blind.js). `CF-Connecting-IP`
# обнуляется явно — иначе он поехал бы дальше сам, и main снова знал бы то,
# чего знать не должен.
#
# Метка входа выставляется по номеру порта, на котором приняли запрос: 8082 —
# это Tor, остальное — Cloudflare. Прислать её самому клиент не может, что бы
# он ни отправил: значение подставится заново. Без этого клиент через Tor
# назначал бы себе и адрес, и вход — там Cloudflare нет, и перезаписать
# заголовки было бы некому.
proxy_set_header CF-Connecting-IP "";
proxy_set_header X-Obsidian-Client $obsidian_client;
proxy_set_header X-Obsidian-Route $obsidian_route;

proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_buffering off;
