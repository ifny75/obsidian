[package]
name = "obsidian-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
# cdylib — для JNI с Android, staticlib — для линковки в Tauri, rlib — для тестов.
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
# Платный вход через TON. Логика цела и покрыта тестами, но в сборку по
# умолчанию не входит: пока вход только по инвайтам.
ton = []

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
sha2 = "0.10"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = "0.3"
openmls = "0.8"
openmls_rust_crypto = "0.5.1"
openmls_basic_credential = "0.5.0"
openmls_traits = "0.5.0"
openmls_memory_storage = "0.5.0"
tls_codec = "0.4.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "net", "io-util"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
